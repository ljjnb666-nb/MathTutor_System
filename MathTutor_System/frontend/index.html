<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>MathTutor_System - 初中数学备课助手</title>
    <script>
      // 避免白色闪烁：在 React 挂载前同步应用主题
      (function() {
        try {
          const savedTheme = localStorage.getItem('ui_theme') || 'dark'
          const savedAccent = localStorage.getItem('ui_accent') || 'indigo'
          const savedDensity = localStorage.getItem('ui_density') || 'comfortable'

          if (savedTheme === 'auto') {
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
            document.documentElement.dataset.theme = systemPrefersDark ? 'dark' : 'light'
          } else {
            document.documentElement.dataset.theme = savedTheme
          }

          document.documentElement.dataset.accent = savedAccent
          document.documentElement.dataset.density = savedDensity
        } catch (e) {
          // 如果 localStorage 不可用，使用默认深色主题
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.dataset.accent = 'indigo'
          document.documentElement.dataset.density = 'comfortable'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
