name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tutorpro
          POSTGRES_PASSWORD: tutorpro_test_password
          POSTGRES_DB: tutorpro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutorpro -d tutorpro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: MathTutor_System/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall app
      - name: Test backend
        env:
          ENV: development
          LLM_API_KEY: ""
          TUTORPRO_TEST_POSTGRES_URL: postgresql+psycopg://tutorpro:tutorpro_test_password@localhost:5432/tutorpro_test
        run: python -m pytest -q -ra --junitxml=backend-results.xml
      - name: Verify PostgreSQL gates actually ran
        run: python scripts/verify_postgres_test_report.py backend-results.xml

  teacher-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MathTutor_System/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: MathTutor_System/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  student-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MathTutor_System/frontend-student
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: MathTutor_System/frontend-student/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
