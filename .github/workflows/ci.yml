name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MathTutor_System/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall app
      - name: Test backend
        env:
          ENV: development
          LLM_API_KEY: ""
        run: python -m pytest -q

  teacher-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MathTutor_System/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: MathTutor_System/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  student-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MathTutor_System/frontend-student
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: MathTutor_System/frontend-student/package-lock.json
      - run: npm ci
      - run: npm run build
